name: taller_app
description: Aplicación de inventario e informes financieros para taller mecánico.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Base de datos (ahora vía Supabase) ─────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.0      # NativeDatabase multiplataforma, incluye sqlite3
  supabase_flutter: ^2.7.0

  # ── Rutas y utilidades ──────────────────────────────────────────
  path: ^1.8.3
  path_provider: ^2.1.1
  crypto: ^3.0.3

  # ── UI ──────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.6

  # ── Gráficas ────────────────────────────────────────────────────
  fl_chart: ^0.66.0

  # ── PDF ─────────────────────────────────────────────────────────
  pdf: ^3.10.7
  printing: ^5.13.4
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # ── Generación de código Drift ──────────────────────────────────
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

  # ── Ícono de la app (launcher) ───────────────────────────────────
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D1B2E"
  adaptive_icon_foreground: